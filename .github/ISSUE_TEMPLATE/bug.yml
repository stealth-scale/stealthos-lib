name: Bug report
description: Report behaviour the library or the command does not keep to.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report a vulnerability through a private advisory rather than here.

  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or the commit of stealthos-lib you run, or the output of `stealth --version`.
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `bash --version | head -1`, `cat /etc/os-release | head -2` and `uname -sr`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: The call
      description: The module and the function, or the `stealth` command line, with the smallest input that shows the behaviour.
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour the docblock or the README led you to expect.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What the library did instead. Paste the log at `-vv` whole rather than a summary of it.
      render: shell
    validations:
      required: true
